<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ativos de TI — app de celular + painel web (demo)</title>
<style>
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; font-family:"Segoe UI",system-ui,sans-serif; color:#0F172A; background:#EEF0F7; }
body{ background:radial-gradient(900px 600px at 12% 8%, #E1E4FB 0, transparent 60%), radial-gradient(900px 600px at 95% 100%, #D9EDF6 0, transparent 60%), #EEF0F7; }
#stage{ position:absolute; left:0; top:0; width:1600px; height:900px; transform-origin:top left; }
.head{ position:absolute; left:200px; top:26px; right:56px; display:flex; align-items:center; justify-content:space-between; }
.head h1{ margin:0; font-size:25px; letter-spacing:-.01em; } .head p{ margin:3px 0 0; color:#64748B; font-size:14px; }
.tags{ display:flex; gap:10px; } .tags span{ padding:7px 14px; border-radius:99px; background:#fff; border:1px solid #E1E5F0; font-weight:600; font-size:13px; color:#475569; display:flex; align-items:center; gap:8px; }
.tags i{ width:9px; height:9px; border-radius:3px; background:#5B5BEF; } .tags span+span i{ background:#0EA5E9; }
.mob{ position:absolute; left:36px; top:92px; width:396px; height:792px; }
.mob iframe{ width:440px; height:880px; border:0; transform:scale(.9); transform-origin:top left; background:transparent; }
.win{ position:absolute; left:566px; top:124px; width:1000px; height:742px; border-radius:16px; background:#fff; box-shadow:0 40px 80px -30px rgba(15,23,42,.45), 0 0 0 1px #D8DCE8; overflow:hidden; display:flex; flex-direction:column; }
.bar{ height:40px; background:#E9ECF4; display:flex; align-items:center; gap:7px; padding:0 14px; flex:none; border-bottom:1px solid #D8DCE8; }
.bar b{ width:11px; height:11px; border-radius:50%; background:#CBD2E0; }
.bar b:nth-child(1){ background:#F87171; } .bar b:nth-child(2){ background:#FBBF24; } .bar b:nth-child(3){ background:#34D399; }
.url{ margin-left:16px; flex:1; max-width:420px; background:#fff; border-radius:8px; padding:5px 12px; font-size:12.5px; color:#64748B; border:1px solid #D8DCE8; }
.win iframe{ border:0; flex:1; width:100%; }
.link{ position:absolute; left:432px; top:380px; width:134px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.node{ width:62px; height:62px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 10px 24px -8px rgba(15,23,42,.35); border:2px solid #10B981; transition:border-color .3s; position:relative; z-index:2; }
.node svg{ width:28px; height:28px; stroke:#10B981; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; transition:stroke .3s; }
.wire{ position:absolute; top:30px; left:-26px; right:-26px; height:3px; background:repeating-linear-gradient(90deg,#10B981 0 8px,transparent 8px 14px); z-index:1; opacity:.8; transition:opacity .3s; }
.link.off .node{ border-color:#94A3B8; } .link.off .node svg{ stroke:#94A3B8; } .link.off .wire{ background:repeating-linear-gradient(90deg,#CBD5E1 0 6px,transparent 6px 14px); opacity:.9; }
.link.sync .node{ border-color:#3B82F6; } .link.sync .node svg{ stroke:#3B82F6; animation:giro 1s linear infinite; } .link.sync .wire{ background:repeating-linear-gradient(90deg,#3B82F6 0 8px,transparent 8px 14px); animation:corre .6s linear infinite; }
@keyframes giro{ to{ transform:rotate(360deg); } } @keyframes corre{ to{ background-position:14px 0; } }
.lbl{ font-size:12.5px; font-weight:700; text-align:center; line-height:1.3; margin-top:2px; max-width:130px; color:#047857; transition:color .3s; z-index:2; }
.link.off .lbl{ color:#64748B; } .link.sync .lbl{ color:#1D4ED8; }
.pk{ position:absolute; top:24px; left:-20px; width:15px; height:15px; border-radius:5px; background:#5B5BEF; box-shadow:0 0 0 4px rgba(91,91,239,.25); z-index:3; opacity:0; }
.pk.go{ animation:voa .9s ease-in forwards; }
@keyframes voa{ 0%{ left:-20px; opacity:1; } 100%{ left:140px; opacity:0; } }
</style>
<style>#stage .demo-voltar{position:absolute;left:56px;top:30px;z-index:50;font-size:15px;padding:10px 18px 10px 14px}.demo-voltar{display:inline-flex;align-items:center;gap:7px;padding:8px 15px 8px 11px;border-radius:99px;background:rgba(10,18,20,.86);color:#fff;font:700 13px "Segoe UI",system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}.demo-voltar:hover{background:rgba(31,111,120,.95)}.demo-voltar svg{stroke:#5AA2FF}</style>
</head>
<body>
<div id="stage">
  <a class="demo-voltar" href="../../index.html#projetos" aria-label="Voltar ao portfólio"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>Voltar</a>
  <div class="head"><div><h1>Ativos de TI · app de celular e painel web</h1><p>O app funciona sem internet, guarda os registros no aparelho e sincroniza com o painel quando a conexão volta.</p></div>
    <div class="tags"><span><i></i>App de celular</span><span><i></i>Painel web</span></div></div>
  <div class="mob"><iframe id="mob" src="mobile.html" title="App de celular"></iframe></div>
  <div class="link" id="link"><div class="wire"></div><div class="pk" id="pk"></div><div class="node" id="node"></div><div class="lbl" id="lbl"></div></div>
  <div class="win"><div class="bar"><b></b><b></b><b></b><div class="url">ativos-ti.demo/painel</div></div><iframe id="pc" src="pc.html" title="Painel web"></iframe></div>
</div>
<script>
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900),st=document.getElementById('stage');st.style.transform='scale('+s+')';st.style.left=((innerWidth-1600*s)/2)+'px';st.style.top=((innerHeight-900*s)/2)+'px';}
addEventListener('resize',fit);fit();
const ICO={online:'<svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1 0-8 5 5 0 0 1 9.7-1A4.5 4.5 0 0 1 17 17z"/></svg>',off:'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 8.2A6 6 0 0 0 7 20h10.5a4 4 0 0 0 1.6-.3M18 10a6 6 0 0 0-8.5-3.6"/></svg>',sync:'<svg viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3M4 4v4h4M4 16a8 8 0 0 0 14 3M20 20v-4h-4"/></svg>'};
let est='online',pend=0;
function paint(){const l=document.getElementById('link');l.className='link '+(est==='offline'?'off':est==='syncing'?'sync':'');
  document.getElementById('node').innerHTML=ICO[est==='offline'?'off':est==='syncing'?'sync':'online'];
  document.getElementById('lbl').innerHTML=est==='offline'?'Sem internet'+(pend?'<br>'+pend+' na fila do celular':'<br>dados salvos no aparelho'):est==='syncing'?'Sincronizando…':'Conectado<br>dados em tempo real';}
const canal='BroadcastChannel' in window?new BroadcastChannel('ativos-sync'):null;
if(canal)canal.onmessage=e=>{const m=e.data;if(m.type==='conn'){est=m.state;pend=m.pend||0;paint();}
  else if(m.type==='registro'){const p=document.getElementById('pk');p.classList.remove('go');void p.offsetWidth;p.classList.add('go');}};
paint();
</script>
<script src="../mobile.js"></script>
</body>
</html>
