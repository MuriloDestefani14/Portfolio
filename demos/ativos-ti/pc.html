<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ativos de TI — Painel web (demo)</title>
<style>
:root{ --bg:#F4F5FA; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E5E8F0; --side:#0F172A; --brand:#5B5BEF; --brand-soft:#ECECFD; --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
#app{ display:flex; height:100%; }
aside{ width:208px; background:var(--side); color:#CBD5E1; display:flex; flex-direction:column; padding:18px 12px; gap:4px; flex:none; }
.brand{ display:flex; align-items:center; gap:10px; padding:4px 10px 18px; color:#fff; font-weight:700; font-size:15px; }
.brand i{ width:28px; height:28px; border-radius:9px; background:linear-gradient(135deg,#7C7CFF,#5B5BEF); display:grid; place-items:center; flex:none; }
.brand i svg{ width:16px; height:16px; stroke:#fff; }
.nav{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:#94A3B8; font-weight:600; cursor:pointer; transition:background .15s,color .15s; white-space:nowrap; }
.nav svg{ width:18px; height:18px; flex:none; }
.nav:hover{ background:rgba(255,255,255,.06); color:#fff; }
.nav.on{ background:rgba(91,91,239,.22); color:#fff; }
.side-foot{ margin-top:auto; display:flex; align-items:center; gap:10px; padding:10px; color:#94A3B8; font-size:12.5px; }
.avatar{ width:30px; height:30px; border-radius:50%; background:#334155; color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; flex:none; }
main{ flex:1; min-width:0; display:flex; flex-direction:column; }
header{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px 6px; gap:14px; }
h1{ margin:0; font-size:21px; font-weight:700; letter-spacing:-.01em; }
.sub{ color:var(--muted); font-size:12.5px; margin-top:2px; }
.right{ display:flex; align-items:center; gap:12px; }
.conn{ display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:99px; background:#fff; border:1px solid var(--line); font-weight:700; font-size:12.5px; white-space:nowrap; transition:all .25s; }
.conn i{ width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 3px rgba(16,185,129,.2); }
.conn.off{ background:#F1F5F9; color:#64748B; } .conn.off i{ background:#94A3B8; box-shadow:0 0 0 3px rgba(148,163,184,.25); }
.conn.sync{ background:#DBEAFE; color:#1E40AF; border-color:#93C5FD; } .conn.sync i{ background:#3B82F6; animation:pulse .8s infinite; }
@keyframes pulse{ 50%{ opacity:.35; } }
.search{ display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-width:200px; color:var(--muted); }
.search svg{ width:16px; height:16px; } .search input{ border:none; outline:none; font:inherit; width:100%; background:transparent; }
.content{ padding:12px 24px 24px; overflow:auto; flex:1; }
.grid{ display:grid; gap:14px; }
.kpis{ grid-template-columns:repeat(4,1fr); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 17px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
.card h3{ margin:0 0 10px; font-size:13.5px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
.card h3 small{ color:var(--muted); font-weight:500; font-size:12px; }
.kpi .ic{ float:right; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand); }
.kpi .ic svg{ width:17px; height:17px; }
.kpi .l{ color:var(--muted); font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
.kpi .v{ font-size:27px; font-weight:700; margin-top:5px; letter-spacing:-.02em; }
.kpi .d{ font-size:12px; color:var(--muted); margin-top:2px; }
.kpi.hl{ border-color:#C7C7F9; box-shadow:0 0 0 3px rgba(91,91,239,.12); }
.two{ grid-template-columns:1fr 1fr; margin-top:14px; }
table{ width:100%; border-collapse:collapse; }
th{ text-align:left; font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:9px 12px; border-bottom:1px solid var(--line); background:#FAFBFE; position:sticky; top:0; }
td{ padding:10px 12px; border-bottom:1px solid #EEF0F6; white-space:nowrap; }
.tag{ font-weight:700; color:var(--brand); }
.pill{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700; }
.p-ok{ background:#D1FAE5; color:#047857; } .p-warn{ background:#FEF3C7; color:#B45309; } .p-mute{ background:#E2E8F0; color:#475569; } .p-info{ background:#DBEAFE; color:#1D4ED8; } .p-app{ background:#EDE9FE; color:#6D28D9; }
.bar{ height:7px; background:#E8EBF3; border-radius:99px; width:90px; overflow:hidden; display:inline-block; vertical-align:middle; }
.bar i{ display:block; height:100%; border-radius:99px; }
.tools{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.chip{ padding:6px 13px; border-radius:99px; background:#fff; border:1px solid var(--line); font-weight:600; color:var(--muted); cursor:pointer; font-size:12.5px; }
.chip.on{ background:var(--brand); border-color:var(--brand); color:#fff; }
.tablewrap{ background:#fff; border:1px solid var(--line); border-radius:14px; overflow:auto; }
.feed{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; max-height:230px; overflow:hidden; }
.feed li{ display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid #EEF0F6; }
.feed .fi{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; flex:none; }
.feed .fi svg{ width:17px; height:17px; }
.feed b{ display:block; font-size:13px; } .feed span.s{ color:var(--muted); font-size:12px; }
.feed li.novo{ animation:entra .9s ease; background:linear-gradient(90deg,#F3F2FF,transparent); border-radius:10px; }
@keyframes entra{ from{ opacity:0; transform:translateY(-14px); } to{ opacity:1; transform:none; } }
tr.novo td{ animation:flash 2.4s ease; }
@keyframes flash{ 0%,60%{ background:#EDE9FE; } 100%{ background:transparent; } }
.legend{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:12px; color:var(--muted); } .legend i{ display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; }
#toast{ position:fixed; right:22px; top:74px; width:310px; background:#0F172A; color:#fff; border-radius:14px; padding:13px 15px; box-shadow:0 18px 40px -12px rgba(15,23,42,.6); transform:translateX(120%); transition:transform .35s ease; z-index:50; display:flex; gap:11px; align-items:center; }
#toast.show{ transform:none; }
#toast .ti{ width:34px; height:34px; border-radius:10px; background:#5B5BEF; display:grid; place-items:center; flex:none; } #toast .ti svg{ width:18px; height:18px; }
#toast b{ display:block; font-size:13px; } #toast span{ color:#A8B3C7; font-size:12px; }
svg text{ font-family:inherit; }
@media (max-width:1100px){ aside{ width:64px; padding:16px 8px; } .brand{ font-size:0; padding:4px 8px 16px; } .nav{ font-size:0; justify-content:center; padding:11px 0; gap:0; } .side-foot div:last-child{ display:none; } .side-foot{ justify-content:center; padding:10px 0; } .search{ display:none; } }
@media (max-width:1100px){ .kpi .v{ font-size:24px; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></i>Ativos de TI</div>
    <a class="nav" data-r="painel"></a><a class="nav" data-r="ativos"></a><a class="nav" data-r="mov"></a><a class="nav" data-r="custos"></a>
    <div class="side-foot"><div class="avatar">UD</div><div>Usuário demo<br><span style="font-size:11.5px">Administrador</span></div></div>
  </aside>
  <main>
    <header><div><h1 id="titulo"></h1><div class="sub" id="sub"></div></div><div class="right"><div class="conn" id="conn"></div><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="busca" placeholder="Buscar ativo ou responsável"></label></div></header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="toast"></div>
<script src="dados.js"></script>
<script>
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={painel:'<path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-3H4zM14 8h6V4h-6z"/>',ativos:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',mov:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>',custos:'<path d="M12 3v18M16.5 7.5C16 6 14.2 5 12 5c-2.4 0-4 1.2-4 3s1.6 2.6 4 3 4 1.2 4 3-1.7 3-4 3c-2.3 0-4.2-1-4.7-2.6"/>',
 kA:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',kB:'<path d="M5 13l4 4L19 7"/>',kC:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8V20h3.2l5.3-5.3a4 4 0 0 0 5.2-5.4z"/>',kD:'<path d="M7 17a4 4 0 0 1 0-8 5 5 0 0 1 9.7-1A4.5 4.5 0 0 1 17 17z"/>',
 insp:'<path d="M9 11l3 3 7-8M5 5h9M5 9h2M5 13h4M5 17h8"/>',in:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',out:'<path d="M12 20V8M7 13l5-5 5 5M5 4h14"/>',swap:'<path d="M7 7h12l-3-3M17 17H5l3 3"/>'};
const NAV={painel:'Painel',ativos:'Ativos',mov:'Movimentações',custos:'Custos'};
const SUB={painel:'Visão geral do parque e atividade do aplicativo móvel',ativos:'Inventário completo, com ciclo de vida de cada item',mov:'Entregas, devoluções e transferências',custos:'Gastos com reparos, peças e garantias'};
document.querySelectorAll('.nav').forEach(n=>{n.innerHTML=svg(IC[n.dataset.r])+NAV[n.dataset.r];n.title=NAV[n.dataset.r];n.onclick=()=>{location.replace('#/'+n.dataset.r)};});
/* ---- gráficos ---- */
function donut(items){const tot=items.reduce((s,x)=>s+x.v,0);let ang=-Math.PI/2;const R=66,r=41,cx=75,cy=75;let p='';
  items.forEach(x=>{const a2=ang+x.v/tot*Math.PI*2,g=a2-ang>Math.PI?1:0,P=(rr,a)=>(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);p+=`<path d="M${P(R,ang)} A${R} ${R} 0 ${g} 1 ${P(R,a2)} L${P(r,a2)} A${r} ${r} 0 ${g} 0 ${P(r,ang)}Z" fill="${x.c}"/>`;ang=a2;});
  return `<div style="display:flex;align-items:center;gap:18px"><svg width="150" height="150" viewBox="0 0 150 150">${p}<text x="75" y="72" text-anchor="middle" font-size="11" fill="#64748B">Total</text><text x="75" y="93" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">${tot}</text></svg><div style="font-size:12.5px;color:#64748B;display:flex;flex-direction:column;gap:5px">${items.map(x=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${x.c};margin-right:7px"></i>${x.l} · <b style="color:#0F172A">${x.v}</b></span>`).join('')}</div></div>`;}
function stack(meses,series,{w=600,h=230}={}){const tot=meses.map((_,i)=>series.reduce((s,x)=>s+x.v[i],0)),max=Math.max(...tot)*1.12,B=28,bw=w/meses.length;let s='';
  [0,.25,.5,.75,1].forEach(f=>{const y=h-B-(h-B-10)*f;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#EEF0F6"/>`;});
  meses.forEach((m,i)=>{let y=h-B;series.forEach(sr=>{const bh=(h-B-10)*sr.v[i]/max;y-=bh;s+=`<rect x="${i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${bh}" fill="${sr.c}" rx="3"/>`;});s+=`<text x="${i*bw+bw/2}" y="${h-9}" text-anchor="middle" font-size="11" fill="#64748B">${m}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${s}</svg>`;}
function bars(items,{w=520,h=230}={}){const max=Math.max(...items.map(x=>x.v))*1.15,B=28,bw=w/items.length;let s='';
  [0,.5,1].forEach(f=>{const y=h-B-(h-B-14)*f;s+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="#EEF0F6"/>`;});
  items.forEach((x,i)=>{const bh=(h-B-14)*x.v/max,xx=i*bw+bw*.2;s+=`<rect x="${xx}" y="${h-B-bh}" width="${bw*.6}" height="${bh}" rx="6" fill="#5B5BEF"/><text x="${xx+bw*.3}" y="${h-B-bh-6}" text-anchor="middle" font-size="11.5" font-weight="700">${(x.v/1000).toFixed(1).replace('.',',')} mil</text><text x="${xx+bw*.3}" y="${h-9}" text-anchor="middle" font-size="11" fill="#64748B">${x.l}</text>`;});
  return `<svg viewBox="0 0 ${w} ${h}" width="100%">${s}</svg>`;}
/* ---- estado em tempo real vindo do app ---- */
const recebidos=[]; let conn={state:'online',pend:0};
const SEMENTE=[{tipo:'Entrega',tag:'NB-0012',modelo:'Orbit Pro 14',por:'Suporte N1',h:'08:14'},{tipo:'Inspeção',tag:'MN-0074',modelo:'Kaon View 27"',por:'Suporte N2',h:'09:02'},{tipo:'Devolução',tag:'SP-0101',modelo:'Lumi Z 12',por:'Suporte N1',h:'09:47'}];
const TI={'Inspeção':['insp','#E0E7FF','#4338CA'],'Entrega':['in','#D1FAE5','#047857'],'Devolução':['out','#DBEAFE','#1D4ED8']};
const hora=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function paintConn(){const c=document.getElementById('conn');c.className='conn '+(conn.state==='offline'?'off':conn.state==='syncing'?'sync':'');
  c.innerHTML='<i></i>App móvel · '+(conn.state==='offline'?'offline'+(conn.pend?` (${conn.pend} na fila)`:''):conn.state==='syncing'?'sincronizando…':'online');}
function toast(rec){const t=document.getElementById('toast');const m=TI[rec.tipo];t.innerHTML=`<div class="ti">${svg(IC.kD)}</div><div><b>Novo registro do app móvel</b><span>${rec.tipo} · ${rec.tag} · ${rec.por}</span></div>`;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function recebe(rec){if(recebidos.some(x=>x.id===rec.id))return;rec.novo=true;recebidos.unshift(rec);
  const a=ativos.find(x=>x.tag===rec.tag);
  if(a){if(rec.tipo==='Entrega'){a.status='Em uso';a.resp='Ana Souza';a.setor='Atendimento';}if(rec.tipo==='Devolução'){a.status='Em estoque';a.resp='Sem responsável';a.setor='Almoxarifado de TI';}}
  if(rec.tipo!=='Inspeção')movs.unshift({d:new Date(rec.quando),tag:rec.tag,modelo:rec.modelo,k:rec.tipo,de:rec.tipo==='Entrega'?'Estoque de TI':(a?a.resp:'—'),para:rec.tipo==='Devolução'?'Estoque de TI':'Ana Souza',origem:'App móvel',novo:true});
  toast(rec);render(true);setTimeout(()=>{rec.novo=false;movs.forEach(m=>m.novo=false);},2600);}
if(canal)canal.onmessage=e=>{const m=e.data;if(m.type==='conn'){conn=m;paintConn();}else if(m.type==='registro')recebe(m.rec);};
/* ---- telas ---- */
let filtro={tipo:'Todos',q:''};
const feedHtml=()=>{const todos=[...recebidos.map(r=>({...r,h:hora(r.quando),novo:r.novo})),...SEMENTE];return `<ul class="feed">${todos.slice(0,5).map(r=>{const m=TI[r.tipo];return `<li class="${r.novo?'novo':''}"><div class="fi" style="background:${m[1]};color:${m[2]}">${svg(IC[m[0]])}</div><div style="flex:1;min-width:0"><b>${r.tipo} · ${r.tag}</b><span class="s">${r.modelo} · ${r.por} · ${r.h}</span></div><span class="pill p-app">App móvel</span></li>`;}).join('')}</ul>`;};
const V={
 painel(){const em=s=>vivos.filter(x=>x.status===s).length,hojeN=3+recebidos.length;
  const k=(l,v,d,i,hl)=>`<div class="card kpi ${hl?'hl':''}"><div class="ic">${svg(IC[i])}</div><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  const cores=['#5B5BEF','#0EA5E9','#10B981','#F59E0B','#EC4899','#8B5CF6'];
  const porTipo=Object.keys(TIPOS).map((t,i)=>({l:t,v:vivos.filter(a=>a.tipo===t).length,c:cores[i]}));
  const renovar=vivos.filter(a=>a.vida<15).sort((a,b)=>a.vida-b.vida).slice(0,5);
  return `<div class="grid kpis">${k('Ativos',vivos.length,'em 6 categorias','kA')}${k('Em uso',em('Em uso'),Math.round(em('Em uso')/vivos.length*100)+'% do parque','kB')}${k('Em reparo',em('Em manutenção'),'aguardando retorno','kC')}${k('Registros do app hoje',hojeN,'enviados pelo celular','kD',recebidos.length>0)}</div>
  <div class="grid two"><div class="card"><h3>Parque por categoria<small>${vivos.length} ativos</small></h3>${donut(porTipo)}</div><div class="card"><h3>Atividade do aplicativo móvel<small>tempo real</small></h3>${feedHtml()}</div></div>
  <div class="card" style="margin-top:14px;padding:0"><h3 style="padding:14px 17px 0">Próximos a renovar<small>vida útil abaixo de 15%</small></h3><table><thead><tr><th>Tag</th><th>Modelo</th><th>Responsável</th><th>Setor</th><th>Vida útil</th></tr></thead><tbody>${renovar.map(a=>`<tr><td class="tag">${a.tag}</td><td>${a.modelo}</td><td>${a.resp}</td><td>${a.setor}</td><td><span class="bar"><i style="width:${a.vida}%;background:${vidaCor(a.vida)}"></i></span> ${Math.round(a.vida)}%</td></tr>`).join('')}</tbody></table></div>`;},
 ativos(){const tipos=['Todos',...Object.keys(TIPOS)];const l=ativos.filter(a=>(filtro.tipo==='Todos'||a.tipo===filtro.tipo)&&(!filtro.q||(a.tag+a.modelo+a.resp+a.setor).toLowerCase().includes(filtro.q)));
  return `<div class="tools" id="chipsTipo">${tipos.map(t=>`<span class="chip ${filtro.tipo===t?'on':''}" data-t="${t}">${t}</span>`).join('')}</div><div class="tablewrap" style="max-height:calc(100% - 52px)"><table><thead><tr><th>Tag</th><th>Categoria</th><th>Modelo</th><th>Responsável</th><th>Setor</th><th>Status</th><th>Vida útil</th></tr></thead><tbody>${l.map(a=>`<tr><td class="tag">${a.tag}</td><td>${a.tipo}</td><td>${a.modelo}</td><td>${a.resp}</td><td>${a.setor}</td><td><span class="pill ${stCls[a.status]}">${a.status}</span></td><td><span class="bar"><i style="width:${a.vida}%;background:${vidaCor(a.vida)}"></i></span> ${Math.round(a.vida)}%</td></tr>`).join('')}</tbody></table></div>`;},
 mov(){return `<div class="tablewrap" style="max-height:100%"><table><thead><tr><th>Data</th><th>Tipo</th><th>Ativo</th><th>De</th><th>Para</th><th>Origem</th></tr></thead><tbody>${movs.map(m=>`<tr class="${m.novo?'novo':''}"><td>${dt(m.d)}</td><td><span class="pill ${m.k==='Entrega'?'p-ok':m.k==='Devolução'?'p-info':'p-warn'}">${m.k}</span></td><td><b class="tag">${m.tag}</b> · ${m.modelo}</td><td>${m.de}</td><td>${m.para}</td><td>${m.origem==='App móvel'?'<span class="pill p-app">App móvel</span>':'<span class="pill p-mute">Painel web</span>'}</td></tr>`).join('')}</tbody></table></div>`;},
 custos(){const meses=['Dez','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov'];const gen=(b,v)=>meses.map(()=>Math.round(b+rnd()*v));
  const S=[{l:'Reparos',c:'#5B5BEF',v:gen(900,1500)},{l:'Peças e baterias',c:'#0EA5E9',v:gen(500,900)},{l:'Garantia estendida',c:'#F59E0B',v:gen(250,300)}];
  const tot=S.reduce((t,s)=>t+s.v.reduce((a,b)=>a+b,0),0),porSetor=SETORES.map(s=>({l:s.slice(0,8),v:Math.round(3200+rnd()*9000)}));
  const k=(l,v,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  return `<div class="grid kpis">${k('Custo no ano',brl(tot),'reparos, peças e garantias')}${k('Médio por ativo',brl(tot/vivos.length),'por ano')}${k('Reparos abertos',reparos.length,'em andamento')}${k('Valor do parque',brl(vivos.reduce((s,a)=>s+a.valor,0)),'na aquisição')}</div>
  <div class="grid two"><div class="card"><h3>Custo mensal por tipo<small>12 meses</small></h3>${stack(meses,S)}<div class="legend">${S.map(s=>`<span><i style="background:${s.c}"></i>${s.l}</span>`).join('')}</div></div><div class="card"><h3>Custo por setor<small>acumulado</small></h3>${bars(porSetor)}</div></div>`;}
};
let cache={};
function render(keep){const r=(location.hash||'#/painel').split('/')[1];const rota=V[r]?r:'painel';
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.r===rota));
  document.getElementById('titulo').textContent=NAV[rota];document.getElementById('sub').textContent=SUB[rota];
  const v=document.getElementById('view'),y=keep===true?v.scrollTop:0;
  if(rota==='custos'&&cache.custos&&keep===true){}
  v.innerHTML=V[rota]();v.scrollTop=y;paintConn();
  const ct=document.getElementById('chipsTipo');if(ct)ct.onclick=e=>{const t=e.target.closest('.chip');if(t){filtro.tipo=t.dataset.t;render();}};}
document.getElementById('busca').oninput=e=>{filtro.q=e.target.value.toLowerCase();if(!location.hash.startsWith('#/ativos'))location.replace('#/ativos');else render();};
window.addEventListener('hashchange',()=>render());render();
</script>
</body>
