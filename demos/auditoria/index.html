<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de auditoria de atendimento — Demo</title>
<style>
:root{ --bg:#0A1020; --card:#101A30; --card2:#0D1528; --line:#1D2A47; --ink:#E6ECF7; --muted:#8C9BB8; --ok:#34D399; --warn:#FBBF24; --bad:#F87171; --brand:#60A5FA; }
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Segoe UI",system-ui,sans-serif; font-size:14px; }
body{ background:radial-gradient(1000px 500px at 85% -10%, #14254A 0, transparent 60%), var(--bg); }
.wrap{ max-width:1400px; margin:0 auto; padding:22px 32px 28px; height:100%; display:flex; flex-direction:column; }
header{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:16px; }
h1{ margin:0; font-size:23px; font-weight:700; letter-spacing:-.01em; }
.sub{ color:var(--muted); font-size:13px; margin-top:3px; }
.right{ display:flex; gap:10px; align-items:center; }
.sum{ display:flex; gap:8px; }
.sum span{ display:flex; align-items:center; gap:7px; padding:7px 13px; border-radius:99px; background:var(--card); border:1px solid var(--line); font-weight:600; font-size:13px; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.d-ok{ background:var(--ok); box-shadow:0 0 8px rgba(52,211,153,.6); } .d-warn{ background:var(--warn); box-shadow:0 0 8px rgba(251,191,36,.6); } .d-bad{ background:var(--bad); box-shadow:0 0 8px rgba(248,113,113,.7); }
.board, .dt{ scrollbar-color:#2A3A5E #0E172C; scrollbar-width:thin; }
.board{ background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; flex:1; min-height:0; overflow-y:auto; }
table{ width:100%; border-collapse:collapse; table-layout:fixed; }
col.k{ width:34%; }
thead th{ position:sticky; top:0; z-index:2; background:#0E172C; padding:14px 12px; text-align:center; font-size:13px; border-bottom:1px solid var(--line); }
thead th:first-child{ text-align:left; padding-left:22px; color:var(--muted); font-weight:600; text-transform:uppercase; font-size:11.5px; letter-spacing:.07em; }
thead th small{ display:block; color:var(--muted); font-weight:500; font-size:11.5px; margin-top:2px; }
tr.sec td{ background:#0D1629; padding:11px 22px; cursor:pointer; border-bottom:1px solid var(--line); border-top:1px solid var(--line); user-select:none; }
tr.sec td.c{ text-align:center; padding:11px 8px; font-size:12.5px; color:var(--muted); }
tr.sec b{ font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; }
tr.sec .chev{ display:inline-block; width:14px; transition:transform .2s; color:var(--brand); margin-right:6px; }
tr.sec.closed .chev{ transform:rotate(-90deg); }
tr.sec .mini{ display:inline-flex; gap:10px; }
tr.sec .mini i{ font-style:normal; display:inline-flex; align-items:center; gap:5px; font-weight:700; }
tr.row td{ padding:10px 12px; border-bottom:1px solid #16213B; text-align:center; }
tr.row td:first-child{ text-align:left; padding-left:34px; color:#CBD5E8; }
tr.row:hover td{ background:#12203C; }
.k-name{ border-bottom:1px dotted #5A6C90; cursor:help; }
.cell{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-width:104px; padding:6px 12px; border-radius:10px; font-weight:700; font-size:13px; cursor:default; }
.c-ok{ background:rgba(52,211,153,.14); color:var(--ok); } .c-warn{ background:rgba(251,191,36,.15); color:var(--warn); } .c-bad{ background:rgba(248,113,113,.16); color:var(--bad); }
.cell.link{ cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.cell.link:hover{ filter:brightness(1.25); }
#tip{ position:fixed; z-index:50; background:#050A16; border:1px solid #2A3A5E; border-radius:10px; padding:10px 13px; font-size:12.5px; color:#D6DFF0; max-width:290px; pointer-events:none; opacity:0; transition:opacity .12s; box-shadow:0 12px 30px rgba(0,0,0,.5); line-height:1.45; }
#tip b{ color:#fff; display:block; margin-bottom:3px; }
#drawer{ position:fixed; top:0; right:0; bottom:0; width:720px; background:#0C1427; border-left:1px solid var(--line); box-shadow:-20px 0 50px rgba(0,0,0,.45); transform:translateX(105%); transition:transform .28s ease; z-index:40; padding:22px 24px; display:flex; flex-direction:column; }
#drawer.open{ transform:none; }
#drawer h2{ margin:0 0 3px; font-size:18px; } #drawer .sub{ margin-bottom:14px; }
.btnx{ position:absolute; top:18px; right:20px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:7px 14px; font:inherit; font-weight:600; cursor:pointer; }
.dt{ overflow:auto; border:1px solid var(--line); border-radius:12px; }
.dt table{ table-layout:auto; } .dt th{ position:sticky; top:0; background:#0E172C; text-align:left; padding:10px 12px; font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--line); }
.dt td{ padding:10px 10px; border-bottom:1px solid #16213B; white-space:nowrap; text-align:left; }
.tagc{ display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:700; }
.shade{ position:fixed; inset:0; background:rgba(2,6,16,.5); opacity:0; pointer-events:none; transition:opacity .25s; z-index:30; }
.shade.on{ opacity:1; pointer-events:auto; }
.foot{ color:var(--muted); font-size:12px; margin-top:10px; display:flex; gap:18px; }
</style>
<style>.demo-voltar{margin-right:18px;flex:none}.demo-voltar{display:inline-flex;align-items:center;gap:7px;padding:8px 15px 8px 11px;border-radius:99px;background:rgba(10,18,20,.86);color:#fff;font:700 13px "Segoe UI",system-ui,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}.demo-voltar:hover{background:rgba(31,111,120,.95)}.demo-voltar svg{stroke:#5AA2FF}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center"><a class="demo-voltar" href="../../index.html#projetos" onclick="if(document.referrer&&history.length>1){history.back();return false;}" aria-label="Voltar ao portfólio"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg>Voltar</a><div><h1>Painel de auditoria · Atendimento</h1><div class="sub">Em dia, atenção ou crítico, por unidade. Clique na seção para recolher e passe o mouse para ver a regra.</div></div></div>
    <div class="right"><div class="sum" id="sum"></div></div>
  </header>
  <div class="board"><table id="tab"></table></div>
  <div class="foot"><span><i class="dot d-ok"></i> Em dia</span><span><i class="dot d-warn"></i> Atenção</span><span><i class="dot d-bad"></i> Crítico: acionar a unidade</span></div>
</div>
<div class="shade" id="shade"></div>
<aside id="drawer"></aside>
<div id="tip"></div>
<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(11), between=(a,b)=>a+rnd()*(b-a), pick=a=>a[Math.floor(rnd()*a.length)];
const UN=[{n:'Norte',ag:'18 agentes'},{n:'Sul',ag:'14 agentes'},{n:'Leste',ag:'11 agentes'},{n:'Oeste',ag:'16 agentes'}];
const pct=v=>v.toFixed(1).replace('.',',')+'%', tmp=m=>m<60?'há '+Math.round(m)+' min':'há '+(m/60).toFixed(1).replace('.',',')+' h';
// regras: devolvem 0 (em dia), 1 (atenção) ou 2 (crítico)
const hi=(a,b)=>v=>v>=a?0:v>=b?1:2, lo=(a,b)=>v=>v<=a?0:v<=b?1:2;
const SEC=[
 {t:'Canais de atendimento',rows:[
  {n:'Chamadas atendidas em até 20 s',src:'Telefonia',regra:'Em dia ≥ 90%; atenção entre 80% e 90%; crítico abaixo de 80%.',g:()=>between(74,97),f:pct,r:hi(90,80)},
  {n:'Chats respondidos em até 2 min',src:'Plataforma de chat',regra:'Em dia ≥ 92%; atenção entre 85% e 92%; crítico abaixo de 85%.',g:()=>between(78,99),f:pct,r:hi(92,85)},
  {n:'E-mails respondidos em até 4 h',src:'Caixa de e-mail compartilhada',regra:'Em dia ≥ 95%; atenção entre 88% e 95%; crítico abaixo de 88%.',g:()=>between(82,99.5),f:pct,r:hi(95,88)},
  {n:'Tickets sem resposta há mais de 24 h',src:'Sistema de tickets',regra:'Em dia: nenhum; atenção: 1 a 5; crítico: mais de 5. Clique para ver a lista.',g:()=>Math.round(rnd()<.35?0:between(1,13)),f:v=>String(v),r:lo(0,5),link:true}]},
 {t:'Qualidade e monitoria',rows:[
  {n:'Monitorias realizadas no mês',src:'Planilha de monitoria',regra:'Percentual da meta mensal. Em dia ≥ 85%; atenção ≥ 60%; crítico abaixo.',g:()=>between(48,102),f:pct,r:hi(85,60)},
  {n:'Nota média de qualidade',src:'Formulário de monitoria',regra:'Escala de 0 a 10. Em dia ≥ 8,5; atenção ≥ 7,5; crítico abaixo.',g:()=>between(6.8,9.4),f:v=>v.toFixed(1).replace('.',','),r:hi(8.5,7.5)},
  {n:'Reclamações reabertas',src:'Sistema de tickets',regra:'Em dia ≤ 2; atenção ≤ 5; crítico acima de 5.',g:()=>Math.round(between(0,9)),f:v=>String(v),r:lo(2,5)},
  {n:'Pesquisa de satisfação importada',src:'Integração de pesquisa',regra:'Tempo desde a última importação. Em dia < 30 min; atenção < 2 h; crítico acima.',g:()=>rnd()<.6?between(4,28):between(35,260),f:tmp,r:lo(30,120)}]},
 {t:'Rotinas e lançamentos',rows:[
  {n:'Escala do dia lançada',src:'Planilha de escala',regra:'Em dia: lançada. Crítico: pendente após as 8h.',g:()=>rnd()<.78?0:1,f:v=>v?'Pendente':'Lançada',r:v=>v?2:0},
  {n:'Pausas lançadas no sistema',src:'Controle de jornada',regra:'Em dia ≥ 97%; atenção ≥ 90%; crítico abaixo de 90%.',g:()=>between(86,100),f:pct,r:hi(97,90)},
  {n:'Planilha de controle atualizada',src:'Servidor de arquivos',regra:'Tempo desde a última gravação. Em dia < 2 h; atenção < 6 h; crítico acima.',g:()=>between(10,520),f:tmp,r:lo(120,360)},
  {n:'Base de clientes sincronizada',src:'CRM',regra:'Em dia < 30 min; atenção < 3 h; crítico acima.',g:()=>rnd()<.7?between(3,25):between(40,330),f:tmp,r:lo(30,180)}]}
];
SEC.forEach(s=>s.rows.forEach(r=>{r.v=UN.map(()=>{const x=r.g();return{x,s:r.r(x),t:r.f(x)}});}));
const closed={}; const CL=['c-ok','c-warn','c-bad'], DOT=['d-ok','d-warn','d-bad'];
function resumo(){let w=0,b=0;SEC.forEach(s=>s.rows.forEach(r=>r.v.forEach(c=>{if(c.s===1)w++;if(c.s===2)b++;})));
  document.getElementById('sum').innerHTML=`<span><i class="dot d-bad"></i>${b} críticos</span><span><i class="dot d-warn"></i>${w} em atenção</span>`;}
function render(){const t=document.getElementById('tab');
  let h=`<colgroup><col class="k"></colgroup><thead><tr><th>Indicador</th>${UN.map(u=>`<th>${u.n}<small>${u.ag}</small></th>`).join('')}</tr></thead><tbody>`;
  SEC.forEach((s,si)=>{const fechada=closed[si];
    h+=`<tr class="sec ${fechada?'closed':''}" data-s="${si}"><td><span class="chev">▾</span><b>${s.t}</b></td>`;
    UN.forEach((u,ui)=>{ if(fechada){const c=[0,0,0];s.rows.forEach(r=>c[r.v[ui].s]++);h+=`<td class="c"><span class="mini">${c[2]?`<i style="color:var(--bad)"><span class="dot d-bad"></span>${c[2]}</i>`:''}${c[1]?`<i style="color:var(--warn)"><span class="dot d-warn"></span>${c[1]}</i>`:''}${!c[1]&&!c[2]?'<i style="color:var(--ok)"><span class="dot d-ok"></span>ok</i>':''}</span></td>`;} else h+='<td class="c"></td>'; });
    h+='</tr>';
    if(!fechada) s.rows.forEach((r,ri)=>{h+=`<tr class="row"><td><span class="k-name" data-tip="${si}.${ri}">${r.n}</span></td>${r.v.map((c,ui)=>`<td><span class="cell ${CL[c.s]} ${r.link&&c.x>0?'link':''}" ${r.link&&c.x>0?`data-d="${ui}"`:''} data-c="${si}.${ri}.${ui}">${c.t}</span></td>`).join('')}</tr>`;});
  });
  t.innerHTML=h+'</tbody>';}
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{if(document.getElementById('drawer').classList.contains('open')){tip.style.opacity=0;return;}const k=e.target.closest('[data-tip]'),c=e.target.closest('[data-c]');let html='';
  if(k){const [s,r]=k.dataset.tip.split('.').map(Number),x=SEC[s].rows[r];html=`<b>${x.n}</b>Fonte: ${x.src}<br>${x.regra}`;}
  else if(c){const [s,r,u]=c.dataset.c.split('.').map(Number),x=SEC[s].rows[r],v=x.v[u];html=`<b>${UN[u].n} · ${x.n}</b>${['Em dia','Atenção','Crítico: acionar a unidade'][v.s]}`+(x.link&&v.x>0?'<br>Clique para abrir a lista de tickets.':'');}
  if(!html){tip.style.opacity=0;return;} tip.innerHTML=html;tip.style.opacity=1;
  const w=tip.offsetWidth,hh=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-12,e.clientX+16)+'px';tip.style.top=Math.min(innerHeight-hh-12,e.clientY+18)+'px';});
document.getElementById('tab').addEventListener('click',e=>{
  const l=e.target.closest('[data-d]'); if(l){abrir(Number(l.dataset.d));return;}
  const s=e.target.closest('tr.sec'); if(s){const i=Number(s.dataset.s);closed[i]=!closed[i];render();}});
const CLIENTES=['Mercado Alfa','Clínica Vida','Oficina do Zé','Escola Prisma','Padaria Trigo','Studio Íris','Hotel Mirante','Farmácia Central','Loja Horizonte','Transportes Rota','Café Aurora','Ótica Visão'];
const AGENTES=['Larissa M.','Pedro H.','Camila R.','Tiago S.','Bianca L.','Rafael D.','Mônica A.','Gustavo P.'];
function abrir(ui){tip.style.opacity=0;const n=UN[ui].n,q=SEC[0].rows[3].v[ui].x;const rows=Array.from({length:Math.min(q,12)},(_,i)=>({id:48200+Math.floor(rnd()*900),c:pick(CLIENTES),ch:pick(['E-mail','Chat','Formulário']),h:Math.round(between(25,96)),a:pick(AGENTES),p:pick(['Alta','Média','Baixa'])}));
  document.getElementById('drawer').innerHTML=`<button class="btnx" onclick="fechar()">Fechar</button><h2>Tickets sem resposta · ${n}</h2><div class="sub">${q} ticket${q>1?'s':''} aguardando retorno há mais de 24 h</div><div class="dt"><table><thead><tr><th>Ticket</th><th>Cliente</th><th>Canal</th><th>Aguardando</th><th>Responsável</th><th>Prioridade</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b style="color:var(--brand)">#${r.id}</b></td><td>${r.c}</td><td>${r.ch}</td><td>${r.h} h</td><td>${r.a}</td><td><span class="tagc" style="background:${r.p==='Alta'?'rgba(248,113,113,.16);color:var(--bad)':r.p==='Média'?'rgba(251,191,36,.15);color:var(--warn)':'rgba(140,155,184,.18);color:#B6C3DC'}">${r.p}</span></td></tr>`).join('')}</tbody></table></div>`;
  document.getElementById('drawer').classList.add('open');document.getElementById('shade').classList.add('on');}
function fechar(){document.getElementById('drawer').classList.remove('open');document.getElementById('shade').classList.remove('on');}
document.getElementById('shade').onclick=fechar;document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar();});
resumo();render();
</script>
</body>
</html>
